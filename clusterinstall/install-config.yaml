apiVersion: v1
baseDomain: okd.evorigin.com
metadata:
  name: [clustername]
compute:
  - name: worker
    replicas: 2        # Workers are approved manually via CSR in UPI
controlPlane:
  name: master
  replicas: 1
networking:
  networkType: OVNKubernetes
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  machineNetwork:
    - cidr: 192.168.0.0/23   # ← Set to YOUR Proxmox VM subnet
  serviceNetwork:
    - 172.30.0.0/16
platform:
  none: {}             # UPI bare-metal/VM mode
pullSecret: '[pullsecret]'
sshKey: |
  [sshkey]
