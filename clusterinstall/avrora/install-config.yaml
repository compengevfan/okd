apiVersion: v1
baseDomain: okd.evorigin.com
metadata:
  name: avrora
compute:
  - name: worker
    replicas: 0        # Workers are approved manually via CSR in UPI
controlPlane:
  name: master
  replicas: 1
networking:
  networkType: OVNKubernetes
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  machineNetwork:
    - cidr: 192.168.10.0/24   # ← Set to YOUR Proxmox VM subnet
  serviceNetwork:
    - 172.30.0.0/16
platform:
  none: {}             # UPI bare-metal/VM mode
pullSecret: '<PASTE_YOUR_PULL_SECRET_JSON_HERE>'
sshKey: |
  ssh-rsa AAAA...your_public_ssh_key_here
